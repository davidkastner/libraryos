[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libraryos"
version = "0.1.0.dev0"
description = "A local-first, agent-native research library"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "David Kastner"}]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyMuPDF>=1.26,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
libraryos = "libraryos.cli:main"

[project.urls]
Repository = "https://github.com/davidkastner/libraryos"
Issues = "https://github.com/davidkastner/libraryos/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libraryos = ["schemas/*.json", "ui/*.html", "ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
